  <body class="app-page">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Main navigation">
        <div class="sidebar-top"><a class="app-brand" href="dashboard.html"><span class="gl-wordmark"><img src="assets/greenloop-fzc-logo.jpg" alt="Greenloop FZC" width="1280" height="427"></span></a><button id="close-menu" hidden aria-hidden="true" tabindex="-1" class="icon-button close-menu" type="button" aria-label="Close menu">×</button></div>
        <nav class="sidebar-nav"></nav>
        <div class="sidebar-user"><span class="user-avatar">SA</span><span><strong>System Admin</strong><small>Super Admin</small></span></div>
      </aside>
      <div id="menu-backdrop" class="menu-backdrop" hidden></div>
      <main class="app-main">
        <header class="topbar"><button id="open-menu" class="icon-button menu-button" type="button" aria-label="Open menu">☰</button><div class="breadcrumb"><a href="dashboard.html">Dashboard</a><span aria-hidden="true">/</span><strong>Accounts</strong></div><div class="topbar-actions"><span class="live-chip">Live database</span></div></header>
        <div class="page-content export-box-content">
          <section class="page-heading"><div><p class="eyebrow">BOX WORKFLOW</p><h1>Accounts</h1><p>Verify boxes, track supplier stock, and review customer exports.</p></div></section>
          <p id="permission-message" class="form-message is-visible" hidden></p>
          <section id="box-queue-app" hidden data-box-page="accounts">
            <nav class="accounts-sections" aria-label="Accounts sections">
              <button type="button" class="accounts-section-card is-active" data-accounts-view="verify" data-search-read-only aria-pressed="true"><span class="accounts-card-icon" aria-hidden="true">✓</span><strong>Verify Box</strong><small>Review saved boxes and select a customer.</small></button>
              <button type="button" class="accounts-section-card" data-accounts-view="supplier" data-search-read-only aria-pressed="false"><span class="accounts-card-icon" aria-hidden="true">▦</span><strong>Supplier Stock</strong><small>All suppliers in one stock table.</small></button>
              <button type="button" class="accounts-section-card" data-accounts-view="customer" data-search-read-only aria-pressed="false"><span class="accounts-card-icon" aria-hidden="true">↗</span><strong>Customer Stock</strong><small>All customers and their exported phones.</small></button>
              <button type="button" class="accounts-section-card" data-accounts-view="imei" data-capability="imei_data" data-capability-page="accounts" data-search-read-only aria-pressed="false" hidden><span class="accounts-card-icon" aria-hidden="true">▤</span><strong>IMEI DATA</strong><small>Stock phone lists, returns and PDF / Excel downloads.</small></button>
            </nav>
            <section id="accounts-verify-panel" aria-label="Verify Box">
            <form id="box-queue-filter" class="box-queue-filter"><label>From date<input name="from" type="date"></label><label>To date<input name="to" type="date"></label><button class="primary-button" type="submit" data-search-read-only>Show boxes</button><button id="clear-box-dates" class="secondary-button" type="button" data-search-read-only>All dates</button></form>
            <p id="box-queue-message" role="status" class="form-message"></p>
            <section class="box-queue-card"><div id="box-queue-list"></div><div class="box-queue-pagination"><button id="box-queue-prev" class="secondary-button" type="button" data-search-read-only>Previous</button><span id="box-queue-count"></span><button id="box-queue-next" class="secondary-button" type="button" data-search-read-only>Next</button></div></section>
            <section id="box-queue-detail" class="box-queue-card" hidden></section>
            </section>
            <section id="accounts-imei-panel" hidden aria-label="IMEI DATA"></section>
            <section id="accounts-stock-panel" hidden aria-labelledby="accounts-stock-title">
              <div class="accounts-stock-heading"><h2 id="accounts-stock-title">Supplier Stock</h2><span id="accounts-stock-updated" class="live-chip" role="status"></span></div>
              <div id="accounts-stock-downloads" class="box-actions"></div>
              <form id="accounts-stock-filter" class="box-queue-filter">
                <label id="accounts-date-from-label">From date<input name="from" type="date"></label>
                <label id="accounts-date-to-label">To date<input name="to" type="date"></label>
                <label class="accounts-search">Find stock<input name="search" type="search" placeholder="Supplier, invoice, model, color…" maxlength="160"></label>
                <button class="primary-button" type="submit" data-search-read-only>Search</button>
                <button id="accounts-stock-clear" class="secondary-button" type="button" data-search-read-only>Clear filters</button>
                <button id="accounts-stock-refresh" class="secondary-button" type="button" data-search-read-only>Refresh</button>
              </form>
              <p id="accounts-stock-note" class="box-review-note"></p>
              <p id="accounts-stock-message" class="form-message" role="status"></p>
              <div id="accounts-stock-totals" class="accounts-stock-totals"></div>
              <div id="accounts-stock-receipts"></div>
              <section id="accounts-stock-details" class="box-queue-card" hidden><h3 id="accounts-stock-selection"></h3><div id="accounts-stock-list"></div><div class="box-queue-pagination"><button id="accounts-stock-prev" class="secondary-button" type="button" data-search-read-only>Previous</button><span id="accounts-stock-count"></span><button id="accounts-stock-next" class="secondary-button" type="button" data-search-read-only>Next</button></div></section>
            </section>
          </section>
        </div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
